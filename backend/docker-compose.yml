# Player/API only. Use this on the LAN backend host (not public).
# From backend/: docker compose up --build
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Warsaw}
      PORT: ${PORT:-3001}
      DATA_DIR: /app/data
      SONGS_DIR: /app/data/songs
      QUEUE_FILE_PATH: /app/data/queue.json
      DB_PATH: /app/data/app.db
      PULSE_SERVER: ${PULSE_SERVER:-tcp:host.docker.internal:4713}
      SDL_AUDIODRIVER: ${SDL_AUDIODRIVER:-pulse}
      FFPLAY_PATH: ${FFPLAY_PATH:-/usr/bin/ffplay}
      FFMPEG_PATH: ${FFMPEG_PATH:-/usr/bin/ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-/usr/bin/ffprobe}
      FFMPEG_LOCATION: ${FFMPEG_LOCATION:-/usr/bin}
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    restart: unless-stopped
